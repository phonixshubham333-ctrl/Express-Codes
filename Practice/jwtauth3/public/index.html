<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>

  <script>
    async function signup() {
      const username = document.getElementById("signup-username").value;
      const password = document.getElementById("signup-password").value;

      await axios.post("http://localhost:3001/signup", {
        username: username,
        password: password,
      });

      alert("You are signed in!!");
    }

    async function signin() {
      const username = document.getElementById("signin-username").value;
      const password = document.getElementById("signin-password").value;

      const response = await axios.post("http://localhost:3001/signin", {
        username: username,
        password: password,
      });

      localStorage.setItem("token", response.data.token);

      document.getElementById("signin-response").innerText =
        response.data.message;

      alert("You are signin!!");
    }

    async function showdetails() {
      const token = localStorage.getItem("token");

      const response = await axios.get("http://localhost:3001/me", {
        headers: { token },
      });

      document.getElementById("output-username").innerText =
        response.data.username;
      document.getElementById("output-password").innerText =
        response.data.password;
    }
  </script>
  <body>
    <div>
      Signup
      <input
        id="signup-username"
        type="text"
        name="username"
        placeholder="username"
      />
      <input
        id="signup-password"
        type="text"
        name="password"
        placeholder="password"
      />
      <button onclick="signup()">Signup</button>
    </div>
    <div>
      Signin
      <input
        id="signin-username"
        type="text"
        name="username"
        placeholder="username"
      />
      <input
        id="signin-password"
        type="text"
        name="password"
        placeholder="password"
      />
      <div id="signin-response"></div>
      <button onclick="signin()">Signin</button>
    </div>
    <div>
      <div id="output-username"></div>
      <div id="output-password"></div>
      <button onclick="showdetails()">Show Details</button>
    </div>
  </body>
</html>
